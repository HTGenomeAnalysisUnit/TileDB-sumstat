[tool.poetry]
name = "scqtl"
version = "0.1.0"
description = "TileDB summary statistics utilities"
authors = ["Bruno Ariano <bruno.ariano.87@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
appdirs = ">=1.4.4,<2.0.0"
click = ">=8.1.8,<9.0.0"
tiledb = ">=0.33.2,<0.34.0"
cloup = ">=3.0.5,<4.0.0"
loguru = ">=0.7.3,<0.8.0"
numpy = ">=1.21.2,<2.0.0"
gwaslab = "^3.6.6"
scipy = ">=1.14"
dask = ">=2024.12.1,<2025.0.0"
dask-jobqueue = ">=0.9.0,<0.10.0"
dask-gateway = ">=2024.1.0,<2025.0.0"
polars = ">=1.19.0,<2.0.0"
pandas = ">=2.2.3,<3.0.0"
pyarrow = ">=18.1.0,<19.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.1"
pre-commit = "^4.0.1"
setuptools = "^75.8.0"
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
pytest-randomly = "^3.16.0"
deptry = "^0.23.0"

[tool.ruff]
line-length = 120

[tool.deptry]
extend_exclude = ["scripts"]

[tool.deptry.per_rule_ignores]
DEP003 = ["scqtl"]
DEP002 = ["pyarrow"]

[tool.poetry.scripts]
scqtl = "scqtl.main:main"  # Adjust to your actual CLI path
