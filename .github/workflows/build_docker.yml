name: Build and Push tdbsumstat Docker Image

on:
  push:
    branches:
      - nextflow_branch
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Required to push to GHCR via GITHUB_TOKEN
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # This part below is the same as docker buildx build --platform linux/amd64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This part replaces all three of your local commands (buildx build, tag, push) in one step. It tags the image with both 1.0 and latest.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/htgenomeanalysisunit/tiledb-sumstat:1.0
            ghcr.io/htgenomeanalysisunit/tiledb-sumstat:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
